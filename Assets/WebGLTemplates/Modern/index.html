<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        height: 52px;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 10;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.3px;
      }

      .badge {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 9999px;
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.3);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn {
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(0);
      }

      #main-area {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }

      #unity-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      #unity-canvas {
        background: #000;
        border-radius: 12px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
        outline: none;
        display: block;
        transition: border-radius 0.2s ease;
      }

      /* Fullscreen mode removes border radius */
      :fullscreen #unity-canvas,
      :-webkit-full-screen #unity-canvas {
        border-radius: 0;
      }

      /* Modern Loading Screen */
      #loading-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        z-index: 20;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(56, 189, 248, 0.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .loading-subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 24px;
      }

      .progress-container {
        width: 280px;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        border-radius: 9999px;
        transition: width 0.2s ease;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      }

      .progress-text {
        font-size: 12px;
        color: #64748b;
        margin-top: 10px;
        font-variant-numeric: tabular-nums;
      }

      #unity-warning {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(239, 68, 68, 0.9);
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-title">
        <span>{{{ PRODUCT_NAME }}}</span>
      </div>
      <div class="header-actions">
        <button id="btn-fullscreen" class="btn" title="Полноэкранный режим">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          Во весь экран
        </button>
      </div>
    </header>

    <div id="main-area">
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading-screen">
          <div class="loading-spinner"></div>
          <div class="loading-title">{{{ PRODUCT_NAME }}}</div>
          <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div id="progress-text" class="progress-text">0%</div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingScreen = document.querySelector("#loading-screen");
      const progressBar = document.querySelector("#progress-bar");
      const progressText = document.querySelector("#progress-text");
      const fullscreenBtn = document.querySelector("#btn-fullscreen");
      const warningBanner = document.querySelector("#unity-warning");

      function showBanner(msg, type) {
        warningBanner.innerHTML = msg;
        warningBanner.style.display = 'block';
        if (type !== 'error') {
          setTimeout(() => { warningBanner.style.display = 'none'; }, 5000);
        }
      }

      // Responsive aspect ratio scaling (16:9) to keep image sharp
      function updateCanvasSize() {
        if (document.fullscreenElement) {
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          return;
        }

        const area = document.querySelector("#main-area");
        const maxW = area.clientWidth - 24;
        const maxH = area.clientHeight - 24;
        const targetAspect = 16 / 9;

        let w = maxW;
        let h = w / targetAspect;

        if (h > maxH) {
          h = maxH;
          w = h * targetAspect;
        }

        canvas.style.width = Math.floor(w) + "px";
        canvas.style.height = Math.floor(h) + "px";
      }

      window.addEventListener("resize", updateCanvasSize);
      updateCanvasSize();

      // Prevent browser default zoom shortcuts (Ctrl/Cmd + Plus/Minus/0/Wheel)
      window.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === "+" || e.key === "-" || e.key === "=" || e.key === "_" || e.code === "NumpadAdd" || e.code === "NumpadSubtract")) {
          e.preventDefault();
        }
      }, { passive: false });
      window.addEventListener("wheel", (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false });

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: showBanner,
        // Match canvas size and support crisp high-DPI rendering (capped at 2x for performance)
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const pct = Math.round(progress * 100);
          progressBar.style.width = pct + "%";
          progressText.innerText = pct + "%";
        }).then((unityInstance) => {
          loadingScreen.classList.add("hidden");
          fullscreenBtn.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((err) => {
          showBanner(err, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
